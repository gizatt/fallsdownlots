[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "two-wheel-mjlab"
version = "0.1.0"
license = "Apache-2.0"
description = "RL environment for a two-wheeled inverted pendulum balancing robot, based on mjlab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mjlab",
    "onnxruntime",
]

[project.entry-points."mjlab.tasks"]
two_wheel_mjlab = "two_wheel_mjlab.tasks"

[tool.ruff]
src = ["src"]
indent-width = 4

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
